<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just TV - Watch & Earn</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #ff0000 0%, #0000ff 100%);
            --card-bg: rgba(0, 0, 0, 0.7);
            --text-color: #ffffff;
            --accent: #00f2fe;
            --btn-color: #ff0055;
        }

        [data-theme="dark"] {
            --bg-gradient: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-color: #e0e0e0;
            --accent: #ff0055;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-gradient); 
            color: var(--text-color); 
            margin: 0; padding: 15px; 
            transition: all 0.5s ease;
            min-height: 100vh;
        }

        /* হেডার ও মোড সুইচ */
        .header { display: flex; justify-content: flex-end; padding: 10px; }
        .theme-switch {
            background: var(--btn-color); color: white; border: none;
            padding: 8px 18px; border-radius: 20px; cursor: pointer;
            font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-size: 14px;
        }

        /* সার্চ বক্স */
        .search-container { text-align: center; margin: 20px 0; }
        #searchBox {
            width: 85%; padding: 15px; border-radius: 30px; border: 3px solid var(--btn-color);
            background: #ffffff; color: #000000; font-size: 16px; font-weight: bold;
            outline: none; box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        .count-info { text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #fff; text-shadow: 1px 1px 5px #000; }

        /* মুভি গ্রিড */
        .movie-grid { 
            display: grid; grid-template-columns: repeat(2, 1fr); 
            gap: 15px; max-width: 900px; margin: 0 auto;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .movie-card { 
            background: var(--card-bg); border-radius: 15px; 
            overflow: hidden; border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .movie-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }

        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #000; }
        
        .info { padding: 12px; text-align: center; }
        .title { 
            font-size: 15px; font-weight: bold; height: 40px; 
            overflow: hidden; color: var(--accent); margin-bottom: 10px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }

        .btn-watch { 
            display: block; padding: 12px; background: var(--btn-color); 
            color: white !important; text-decoration: none; border-radius: 10px; 
            font-weight: bold; font-size: 14px; transition: 0.3s;
            cursor: pointer; border: none; width: 100%;
        }
        .btn-watch:active { transform: scale(0.95); }

        /* পেজিনেশন বাটন */
        .pagination { display: flex; justify-content: center; gap: 20px; margin: 30px 0; }
        .nav-btn {
            padding: 12px 25px; border: none; border-radius: 25px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: white; font-weight: bold; cursor: pointer;
            transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .nav-btn:disabled { background: #666; cursor: not-allowed; box-shadow: none; }

        /* লোডার */
        #loader { text-align: center; margin-top: 50px; }
        .spinner {
            width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid var(--btn-color); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="header">
    <button class="theme-switch" onclick="toggleTheme()" id="themeBtn">Dark Mode</button>
</div>

<div class="search-container">
    <input type="text" id="searchBox" placeholder="মুভির নাম লিখুন..." onkeyup="handleSearch()">
</div>

<div class="count-info" id="totalCount">Total Movies: Loading...</div>

<div id="loader">
    <div class="spinner"></div>
    <p>Loading Movies... Please Wait</p>
</div>

<div class="movie-grid" id="movie-list"></div>

<div class="pagination" id="pagination">
    <button class="nav-btn" id="prevBtn" onclick="changePage(-1)">Previous</button>
    <button class="nav-btn" id="nextBtn" onclick="changePage(1)">Next</button>
</div>

<script>
    const SPREADSHEET_ID = '1O_Ow3sEUcKWfA3sBSAV7e5y3HYuqTMu-Ayq0wIjNapc';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv`;
    
    // আপনার দেওয়া লিংগুগুলো সেট করা হয়েছে
    const AD_LINK = 'https://www.profitablecpmratenetwork.com/ki1r1rg6r?key=454e0820cac5fb2318b99a71be7294ee';
    const DEFAULT_IMG = 'https://i.giphy.com/media/3zhxq2ttgN6rEw8SDx/giphy.gif'; 

    let allMovies = [];
    let filteredMovies = [];
    let currentPage = 1;
    const itemsPerPage = 50;

    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById('themeBtn');
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            btn.innerText = 'Dark Mode';
        } else {
            body.setAttribute('data-theme', 'dark');
            btn.innerText = 'Light Mode';
        }
    }

    async function init() {
        const today = new Date().toDateString();
        const lastFetch = localStorage.getItem('lastDate');
        const cached = localStorage.getItem('movies');

        if (lastFetch === today && cached) {
            allMovies = JSON.parse(cached);
            finishInit();
        } else {
            try {
                const res = await fetch(CSV_URL);
                const text = await res.text();
                const rows = text.split('\n').slice(1);
                allMovies = rows.map(r => {
                    const c = r.split(',');
                    return { 
                        name: c[0]?.replace(/"/g, "").trim() || '', 
                        link: c[1]?.replace(/"/g, "").trim() || '#', 
                        img: c[2]?.replace(/"/g, "").trim() || '' 
                    };
                }).filter(m => m.name !== "");
                
                localStorage.setItem('movies', JSON.stringify(allMovies));
                localStorage.setItem('lastDate', today);
                finishInit();
            } catch (e) {
                document.getElementById('loader').innerText = "Network Error!";
            }
        }
    }

    function finishInit() {
        filteredMovies = allMovies;
        document.getElementById('totalCount').innerText = `Total Movies: ${allMovies.length}`;
        document.getElementById('loader').style.display = 'none';
        renderPage();
    }

    // বাটন ক্লিক হ্যান্ডলার (র্যান্ডমলি অ্যাড বা মুভি খুলবে)
    function handleWatchClick(movieLink) {
        const randomValue = Math.random(); 
        if (randomValue < 0.5) {
            // ৫০% চান্স অ্যাড লিঙ্ক খোলার
            window.open(AD_LINK, '_blank');
        } else {
            // ৫০% চান্স আসল মুভি লিঙ্ক খোলার
            window.open(movieLink, '_blank');
        }
    }

    function renderPage() {
        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const pageItems = filteredMovies.slice(start, end);
        
        const container = document.getElementById('movie-list');
        container.innerHTML = '';
        
        pageItems.forEach(m => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.innerHTML = `
                <img src="${m.img || DEFAULT_IMG}" onerror="this.src='${DEFAULT_IMG}'" loading="lazy">
                <div class="info">
                    <div class="title">${m.name}</div>
                    <button class="btn-watch" onclick="handleWatchClick('${m.link}')">WATCH NOW</button>
                </div>
            `;
            container.appendChild(card);
        });

        document.getElementById('prevBtn').disabled = currentPage === 1;
        document.getElementById('nextBtn').disabled = end >= filteredMovies.length;
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function changePage(step) {
        currentPage += step;
        renderPage();
    }

    function handleSearch() {
        const query = document.getElementById('searchBox').value.toLowerCase();
        filteredMovies = allMovies.filter(m => m.name.toLowerCase().includes(query));
        currentPage = 1;
        renderPage();
    }

    init();
</script>

</body>
</html>
