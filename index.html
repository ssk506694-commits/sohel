<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: sans-serif;
    /* ডে মোডের ব্যাকগ্রাউন্ড: রেড এবং ব্লু এর মিক্সচার */
    background: linear-gradient(135deg, #ff416c, #0052d4); 
    min-height: 100vh;
    transition: background 0.5s ease;
  }

  /* ডার্ক মোডের ব্যাকগ্রাউন্ড */
  body.dark-mode {
    background: #121212; 
  }

  /* টপ বার এবং থিম বাটন */
  .top-bar {
    position: relative;
    width: 100%;
    height: 60px;
  }
  .theme-toggle-btn {
    position: absolute;
    right: 5%;
    top: 15px;
    padding: 8px 16px;
    border: none;
    border-radius: 20px;
    background-color: #ffffff;
    color: #333333;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
  }
  body.dark-mode .theme-toggle-btn {
    background-color: #333333;
    color: #ffffff;
    box-shadow: 0 4px 6px rgba(255,255,255,0.1);
  }

  /* সার্চ বক্সের ডিজাইন */
  .search-container {
    text-align: center;
    margin: 0 auto 20px auto;
    width: 90%; 
    max-width: 500px;
  }
  .search-box {
    width: 100%;
    padding: 15px 20px; 
    font-size: 18px; 
    border: 2px solid #ffffff;
    border-radius: 30px;
    outline: none;
    transition: all 0.3s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    box-sizing: border-box;
  }
  body.dark-mode .search-box {
    background-color: #2c2c2c;
    color: #ffffff;
    border-color: #444444;
  }
  .search-box:focus {
    border-color: #007bff;
    box-shadow: 0 4px 12px rgba(0,123,255,0.5);
  }

  /* কার্ডের কন্টেইনার */
  .my-card-container { 
    display: flex; 
    flex-wrap: wrap; 
    justify-content: space-between; 
    padding: 10px; 
    width: 100%;
    box-sizing: border-box;
  }

  /* কার্ডের ডিজাইন */
  .my-dynamic-card { 
    width: 48%; 
    margin-bottom: 15px; 
    border: none; 
    border-radius: 10px; 
    text-decoration: none !important; 
    color: #333; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
    background-color: #fff; 
    display: flex; 
    flex-direction: column; 
    opacity: 0; 
    transition: transform 0.6s ease-out, opacity 0.6s ease-out, background-color 0.5s; 
    box-sizing: border-box;
    overflow: hidden;
  }
  
  /* ডার্ক মোডে কার্ডের কালার */
  body.dark-mode .my-dynamic-card {
    background-color: #1e1e1e;
    color: #ffffff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }

  .my-dynamic-card img { 
    width: 100%; 
    height: 120px; 
    display: block; 
    border-bottom: 2px solid #eee; 
    object-fit: fill; 
  }
  body.dark-mode .my-dynamic-card img {
    border-bottom: 2px solid #333; 
  }
  
  .my-card-title { 
    text-align: center; 
    padding: 10px 5px; 
    font-size: 14px; 
    font-weight: bold; 
    background: #f8f9fa; 
    margin: 0; 
    word-wrap: break-word;
    transition: background-color 0.5s;
  }
  body.dark-mode .my-card-title {
    background: #2a2a2a;
    color: #ffffff;
  }

  /* অ্যানিমেশন */
  .slide-hidden-left { transform: translateX(-30px); }
  .slide-hidden-right { transform: translateX(30px); }
  .slide-show { opacity: 1; transform: translateX(0); }
</style>
</head>
<body>

<div class="top-bar">
  <button id="themeToggle" class="theme-toggle-btn" onclick="toggleTheme()">🌙 Dark Mode</button>
</div>

<div class="search-container">
  <input type="text" id="movieSearch" class="search-box" placeholder="🔍 Search..." onkeyup="filterCards()">
</div>

<div id="dynamic-cards-wrapper" class="my-card-container"></div>

    var body = document.body;

  var allCards = [];

  // ৯০% ম্যাচিং রেশিও লজিক
  function isPartialMatch(title, query) {
    if (!query) return true;
    title = title.toLowerCase();
    query = query.toLowerCase();

    if (title.indexOf(query) > -1) return true;

    var queryChars = query.split('');
    var matchIndex = -1;
    var matchedCount = 0;

    for (var i = 0; i < queryChars.length; i++) {
      var foundPos = title.indexOf(queryChars[i], matchIndex + 1);
      if (foundPos > -1) {
        matchIndex = foundPos;
        matchedCount++;
      }
    }
    return (matchedCount >= Math.ceil(query.length * 0.90));
  }

  // ডেটা প্রসেস
  function parseData() {
    var cleanText = rawData.replace(/([^\s="'])(https?:\/\/)/gi, '$1 $2');
    var words = cleanText.split(/[\s\n]+/);
    var currentTitle = [];
    var currentLinks = [];
    
    for(var i=0; i<words.length; i++) {
      var w = words[i].trim();
      if(!w) continue;
      
      if(w.indexOf('http') === 0) {
        currentLinks.push(w);
      } else {
        if(currentLinks.length > 0) {
          allCards.push({ title: currentTitle.join(' '), links: currentLinks });
          currentTitle = [w];
          currentLinks = [];
        } else {
          currentTitle.push(w);
        }
      }
    }
    if(currentTitle.length > 0 || currentLinks.length > 0) {
       allCards.push({ title: currentTitle.join(' '), links: currentLinks });
    }
    
    renderCards(""); 
  }

  // কার্ড রেন্ডার
  function renderCards(searchQuery) {
    var wrap = document.getElementById('dynamic-cards-wrapper');
    wrap.innerHTML = ""; 
    
    var obs = new IntersectionObserver(function(e){ 
      e.forEach(function(x){ 
        if(x.isIntersecting) { x.target.classList.add('slide-show'); } 
      }); 
    }, {threshold: 0.1});
    
    var displayCount = 0;

    for(var j=0; j<allCards.length; j++) {
      var cardInfo = allCards[j];
      if(cardInfo.links.length === 0) continue;
      
      var titleText = cardInfo.title.trim() || "Part " + (j+1);
      
      if (!isPartialMatch(titleText, searchQuery)) continue;

      var videoLink = cardInfo.links[0];
      var imageLink = cardInfo.links[1] || defaultMissingImage; 
      
      var a = document.createElement('a'); 
      a.href = videoLink; 
      a.target = '_blank';
      a.className = 'my-dynamic-card ' + (displayCount % 2 === 0 ? 'slide-hidden-left' : 'slide-hidden-right');
      
      var im = document.createElement('img');
      im.src = imageLink;
      
      var d = document.createElement('div'); 
      d.className = 'my-card-title';
      d.innerText = titleText;
      
      a.appendChild(im); a.appendChild(d); wrap.appendChild(a); obs.observe(a);
      displayCount++;
    }

    if(displayCount === 0 && searchQuery !== "") {
        wrap.innerHTML = "<p style='text-align:center; width:100%; color:#ffffff; margin-top:20px; font-size: 16px;'>No movie found!</p>";
    }
  }

  function filterCards() {
    var query = document.getElementById('movieSearch').value;
    renderCards(query);
  }

  window.onload = function() { setTimeout(parseData, 300); };
