<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just TV - Advanced Movie List</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #ff0000 0%, #0000ff 100%);
            --card-bg: rgba(0, 0, 0, 0.7);
            --text-color: #ffffff;
            --accent: #00f2fe;
            --btn-color: #ff0055;
        }

        [data-theme="dark"] {
            --bg-gradient: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-color: #e0e0e0;
            --accent: #ff0055;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-gradient); 
            color: var(--text-color); 
            margin: 0; padding: 15px; 
            transition: all 0.5s ease;
            min-height: 100vh;
        }

        /* হেডার ও মোড সুইচ */
        .header { display: flex; justify-content: flex-end; padding: 10px; }
        .theme-switch {
            background: var(--btn-color); color: white; border: none;
            padding: 8px 15px; border-radius: 20px; cursor: pointer;
            font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* সার্চ বক্স */
        .search-container { text-align: center; margin: 20px 0; }
        #searchBox {
            width: 85%; padding: 15px; border-radius: 30px; border: 2px solid var(--btn-color);
            background: white; color: #000; font-size: 16px; outline: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .count-info { text-align: center; font-weight: bold; margin-bottom: 15px; color: #fff; }

        /* মুভি গ্রিড */
        .movie-grid { 
            display: grid; grid-template-columns: repeat(2, 1fr); 
            gap: 15px; max-width: 900px; margin: 0 auto;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .movie-card { 
            background: var(--card-bg); border-radius: 15px; 
            overflow: hidden; border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s;
        }
        .movie-card:hover { transform: scale(1.03); }

        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        
        .info { padding: 12px; text-align: center; }
        .title { 
            font-size: 15px; font-weight: bold; height: 40px; 
            overflow: hidden; color: #00f2fe; margin-bottom: 10px;
        }

        .btn-watch { 
            display: block; padding: 10px; background: var(--btn-color); 
            color: white !important; text-decoration: none; border-radius: 8px; 
            font-weight: bold; font-size: 14px; transition: 0.3s;
        }
        .btn-watch:hover { background: #ff3377; transform: translateY(-2px); }

        /* পেজিনেশন বাটন */
        .pagination { display: flex; justify-content: center; gap: 20px; margin: 30px 0; }
        .nav-btn {
            padding: 12px 25px; border: none; border-radius: 25px;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            color: white; font-weight: bold; cursor: pointer;
            transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .nav-btn:disabled { background: #555; cursor: not-allowed; }

        /* লোডার */
        #loader { text-align: center; margin-top: 50px; }
        .spinner {
            width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid var(--btn-color); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="header">
    <button class="theme-switch" onclick="toggleTheme()" id="themeBtn">Dark Mode</button>
</div>

<div class="search-container">
    <input type="text" id="searchBox" placeholder="মুভির নাম লিখুন..." onkeyup="handleSearch()">
</div>

<div class="count-info" id="totalCount">মোট মুভি: লোড হচ্ছে...</div>

<div id="loader">
    <div class="spinner"></div>
    <p>অপেক্ষা করুন, মুভি সাজানো হচ্ছে...</p>
</div>

<div class="movie-grid" id="movie-list"></div>

<div class="pagination" id="pagination">
    <button class="nav-btn" id="prevBtn" onclick="changePage(-1)">Previous</button>
    <button class="nav-btn" id="nextBtn" onclick="changePage(1)">Next</button>
</div>

<script>
    const SPREADSHEET_ID = '1O_Ow3sEUcKWfA3sBSAV7e5y3HYuqTMu-Ayq0wIjNapc';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv`;
    const DEFAULT_IMG = 'https://i.giphy.com/media/3zhxq2ttgN6rEw8SDx/giphy.gif'; 

    let allMovies = [];
    let filteredMovies = [];
    let currentPage = 1;
    const itemsPerPage = 50;

    // ১. থিম সুইচ ফাংশন
    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById('themeBtn');
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            btn.innerText = 'Dark Mode';
        } else {
            body.setAttribute('data-theme', 'dark');
            btn.innerText = 'Light Mode';
        }
    }

    // ২. ডেটা লোড (দিনে একবার)
    async function init() {
        const today = new Date().toDateString();
        const lastFetch = localStorage.getItem('lastDate');
        const cached = localStorage.getItem('movies');

        if (lastFetch === today && cached) {
            allMovies = JSON.parse(cached);
            finishInit();
        } else {
            try {
                const res = await fetch(CSV_URL);
                const text = await res.text();
                const rows = text.split('\n').slice(1);
                allMovies = rows.map(r => {
                    const c = r.split(',');
                    return { 
                        name: c[0]?.replace(/"/g, "").trim() || '', 
                        link: c[1]?.replace(/"/g, "").trim() || '#', 
                        img: c[2]?.replace(/"/g, "").trim() || '' 
                    };
                }).filter(m => m.name !== "");
                
                localStorage.setItem('movies', JSON.stringify(allMovies));
                localStorage.setItem('lastDate', today);
                finishInit();
            } catch (e) {
                document.getElementById('loader').innerText = "ডেটা লোড করতে সমস্যা হয়েছে!";
            }
        }
    }

    function finishInit() {
        filteredMovies = allMovies;
        document.getElementById('totalCount').innerText = `মোট মুভি আছে: ${allMovies.length} টি`;
        document.getElementById('loader').style.display = 'none';
        renderPage();
    }

    // ৩. মুভি রেন্ডার ও পেজিনেশন
    function renderPage() {
        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const pageItems = filteredMovies.slice(start, end);
        
        const container = document.getElementById('movie-list');
        container.innerHTML = '';
        
        pageItems.forEach(m => {
            container.innerHTML += `
                <div class="movie-card">
                    <img src="${m.img || DEFAULT_IMG}" onerror="this.src='${DEFAULT_IMG}'" loading="lazy">
                    <div class="info">
                        <div class="title">${m.name}</div>
                        <a href="${m.link}" target="_blank" class="btn-watch">WATCH NOW</a>
                    </div>
                </div>
            `;
        });

        document.getElementById('prevBtn').disabled = currentPage === 1;
        document.getElementById('nextBtn').disabled = end >= filteredMovies.length;
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function changePage(step) {
        currentPage += step;
        renderPage();
    }

    // ৪. সার্চ ফাংশন (স্মুদ)
    function handleSearch() {
        const query = document.getElementById('searchBox').value.toLowerCase();
        filteredMovies = allMovies.filter(m => m.name.toLowerCase().includes(query));
        currentPage = 1; // সার্চ করলে প্রথম পেজ থেকে দেখাবে
        renderPage();
    }

    init();
</script>

</body>
</html>
